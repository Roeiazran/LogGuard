name: host-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: "23.1.3"
  CLANG_TIDY_VERSION: "23.1.3"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: scripts/format.sh --check

  build-test:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-24.04, cxx: g++-14 }
          - { name: linux-clang, os: ubuntu-24.04, cxx: clang++-18 }
          - { name: macos-clang, os: macos-15,     cxx: clang++ }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake --preset debug -DLOGGUARD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  sanitizers:
    name: Sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Newer kernels randomize memory layout more than TSan supports.
      - name: Reduce ASLR entropy for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DLOGGUARD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and clang-tidy
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pipx install "clang-tidy==${CLANG_TIDY_VERSION}"
      - name: Configure
        run: cmake --preset lint
      - name: Build with clang-tidy
        run: cmake --build --preset lint
